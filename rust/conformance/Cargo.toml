[package]
name = "vbare-conformance"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Conformance tests comparing the vbare codec with bare_proc, serde_bare and bare-ts"
build = "build/main.rs"

[dependencies]
# The published BARE reference implementation.
bare_proc = "=0.2.0"
serde_bare = "=0.5.0"
serde = { version = "1", features = ["derive"] }
proptest = "1"
serde_json = "1"
vbare = { path = "../vbare", features = ["serde"] }

[build-dependencies]
heck.workspace = true
prettyplease.workspace = true
syn.workspace = true
vbare-gen = { path = "../vbare-gen" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "codec"
harness = false
